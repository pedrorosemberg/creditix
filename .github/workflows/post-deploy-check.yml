name: Verificação pós-deploy

# Depois que uma promoção é mergeada em prod, o deploy na nuvem (Vercel ou
# self-hosted) acontece de forma assíncrona — um merge verde não garante
# que o deploy resultante subiu com sucesso. Este workflow espera um pouco
# (dar tempo do build/deploy terminar) e confere a saúde real do ambiente.
# Se falhar, o código já está mergeado mas o ambiente está quebrado — trate
# como incidente, não como "a promoção falhou".

on:
  push:
    branches: [prod]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.PROD_BASE_URL || secrets.PROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aguardar o deploy terminar
        if: env.BASE_URL != ''
        run: sleep 90

      - name: Verificar saúde do deploy
        if: env.BASE_URL != ''
        run: node scripts/verificar-saude-deploy.mjs

      - name: Sem BASE_URL configurada
        if: env.BASE_URL == ''
        run: echo "Pulado — configure PROD_BASE_URL para habilitar a verificação pós-deploy."
