name: CI

# Gate obrigatório para promoção dev -> prod: nenhuma PR para prod deve ser
# mergeada sem este workflow verde (configure isso como "required status
# check" na proteção da branch prod — veja docs/ENVIRONMENTS.md).

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Só pra disparar "Promover ambiente" via workflow_dispatch no fim
      # deste job (ver último step) — uma chamada explícita de API não sofre
      # a restrição do GITHUB_TOKEN de não disparar outros workflows (essa
      # restrição vale só pra eventos push/pull_request causados por ele).
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder

      # Gates rápidos e sempre obrigatórios — mesmo em correção emergencial
      # (ver test-suite.yml para a suíte completa, que pode ser pulada nesse
      # caso). Um segredo de negócio vazado ou uma regressão grande de
      # bundle não devem ir pra produção mesmo sob pressa.
      - name: Verificar vazamento de segredo de negócio no bundle do cliente
        run: npm run verificar:segredo-negocio

      - name: Verificar orçamento de tamanho do bundle
        run: npm run verificar:orcamento-bundle

      - name: Auditoria de dependências (falhas críticas/altas)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Disparar promoção automática (dev->prod)
        # Só em push (não em PR) e só na branch dev. O workflow_run como
        # gatilho pra isso se mostrou pouco confiável neste ambiente (fires
        # instantaneamente, sem esperar este job terminar) — chamar
        # workflow_dispatch explicitamente aqui é o jeito documentado e
        # confiável de um workflow disparar outro.
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote.yml --ref dev
