name: Promover ambiente

# Abre (ou atualiza) automaticamente a PR de promoção dev->prod, classifica
# a urgência (hotfix/emergencial vs. feature normal) pelos commits que
# estão sendo promovidos, e liga auto-merge — a PR mergeia sozinha assim
# que os checks obrigatórios da branch prod (workflows CI e Test Suite)
# passarem.
#
# Disparado automaticamente pelo último step de ci.yml quando o CI passa em
# dev (via "gh workflow run", não por um evento push/pull_request — só
# assim o GITHUB_TOKEN de lá pode acionar este workflow). Também pode ser
# disparado manualmente (aba Actions -> Promover ambiente -> Run workflow).
#
# Requer o secret PROMOTE_PAT (um Personal Access Token, não o GITHUB_TOKEN
# padrão) para criar a PR e fazer o merge, porque o GitHub não dispara
# outros workflows a partir de eventos (push/pull_request) causados pelo
# próprio GITHUB_TOKEN — sem isso, a PR seria criada mas o Test Suite nunca
# rodaria automaticamente. Ver docs/ENVIRONMENTS.md para o passo a passo de
# criação do token.

on:
  workflow_dispatch:

jobs:
  abrir-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que o PROMOTE_PAT está configurado
        env:
          PROMOTE_PAT: ${{ secrets.PROMOTE_PAT }}
        run: |
          if [ -z "$PROMOTE_PAT" ]; then
            echo "::error::Secret PROMOTE_PAT não configurado — a PR não pode ser criada de um jeito que dispare o Test Suite automaticamente. Veja docs/ENVIRONMENTS.md#promoção-automática."
            exit 1
          fi

      - name: Classificar urgência (hotfix/emergencial vs. feature)
        id: classificacao
        run: |
          git fetch origin dev prod
          MENSAGENS=$(git log origin/prod..origin/dev --format=%s)
          if [ -z "$MENSAGENS" ]; then
            echo "label=" >> "$GITHUB_OUTPUT"
            echo "Nada novo para promover de dev para prod."
            exit 0
          fi
          # Hotfix só quando TODOS os commits sendo promovidos são correção —
          # basta uma linha de feature no meio pra exigir a suíte completa.
          if echo "$MENSAGENS" | grep -qvi '^fix\|\[hotfix\]\|\[emergencial\]'; then
            echo "label=criticidade:feature" >> "$GITHUB_OUTPUT"
          else
            echo "label=criticidade:hotfix" >> "$GITHUB_OUTPUT"
          fi
          echo "Commits sendo promovidos:"
          echo "$MENSAGENS"

      - name: Criar labels de criticidade (se não existirem)
        if: steps.classificacao.outputs.label != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
        run: |
          if ! gh label create "criticidade:feature" --color "1D76DB" --description "Passa pela suíte completa de testes" --force \
            || ! gh label create "criticidade:hotfix" --color "D93F0B" --description "Correção/emergência — pula os gates lentos (carga, performance, E2E)" --force; then
            echo "::error::Não foi possível criar/atualizar as labels — o PROMOTE_PAT provavelmente não tem a permissão 'Issues: Read and write' (o GitHub gerencia labels pela API de Issues, mesmo quando aplicadas numa PR). Veja docs/ENVIRONMENTS.md#1-crie-o-secret-promote_pat."
            exit 1
          fi

      - name: Criar ou atualizar a Pull Request de promoção
        if: steps.classificacao.outputs.label != ''
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          LABEL: ${{ steps.classificacao.outputs.label }}
        run: |
          NUMERO=$(gh pr list --head dev --base prod --state open --json number --jq '.[0].number')
          if [ -z "$NUMERO" ]; then
            gh pr create \
              --head dev \
              --base prod \
              --title "Promover dev → prod" \
              --body "PR automática de promoção de \`dev\` para \`prod\`. Classificada como \`$LABEL\`. Mergeia automaticamente quando os checks obrigatórios passarem (ver docs/ENVIRONMENTS.md)." \
              --label "$LABEL"
            NUMERO=$(gh pr list --head dev --base prod --state open --json number --jq '.[0].number')
          else
            gh pr edit "$NUMERO" --add-label "$LABEL"
          fi
          echo "numero=$NUMERO" >> "$GITHUB_OUTPUT"

      - name: Disparar Test Suite explicitamente
        # O evento pull_request do GitHub às vezes não dispara quando a PR é
        # aberta pra um branch cujo commit já existia antes (o GitHub
        # reaproveita o check suite criado pelo push anterior e nunca chega
        # a reavaliar o gatilho pull_request contra ele) — confirmado na
        # prática na primeira execução real desta esteira. Disparar aqui
        # explicitamente garante que os checks obrigatórios (seguranca,
        # cloud, ...) sempre rodem, independentemente desse comportamento.
        if: steps.classificacao.outputs.label != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          LABEL: ${{ steps.classificacao.outputs.label }}
        run: |
          URGENTE="false"
          [ "$LABEL" = "criticidade:hotfix" ] && URGENTE="true"
          gh workflow run test-suite.yml --ref dev -f urgente="$URGENTE"

      - name: Ligar auto-merge
        # --merge, não --squash: dev e prod são branches de longa duração
        # que se mergeiam repetidamente entre si — squash quebra a
        # ancestralidade compartilhada entre elas (o commit squashado no
        # destino nunca é ancestral dos commits individuais que continuam
        # na origem), e a PRÓXIMA promoção do mesmo arquivo aparece como
        # conflito mesmo sem mudança conceitual nenhuma — confirmado na
        # prática. Squash continua correto para branches de feature que
        # morrem após o merge — não é o caso aqui.
        if: steps.classificacao.outputs.label != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
        run: gh pr merge "${{ steps.pr.outputs.numero }}" --auto --merge
